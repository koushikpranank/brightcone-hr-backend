# Loco configuration file documentation

# Application logging configuration
logger:
  # Enable or disable logging.
  enable: false
  # Enable pretty backtrace (sets RUST_BACKTRACE=1)
  pretty_backtrace: true
  # Log level, options: trace, debug, info, warn or error.
  level: debug
  # Define the logging format. options: compact, pretty or json
  format: compact
  # By default the logger has filtering only logs that came from your code or logs that came from `loco` framework. to see all third party libraries
  # Uncomment the line below to override to see all third party libraries you can enable this config and override the logger filters.
  # override_filter: trace

# Web server configuration
server:
  # Port on which the server will listen. the server binding is 0.0.0.0:{PORT}
  port: 5150
  # The UI hostname or IP address that mailers will point to.
  host: http://localhost
  # Out of the box middleware configuration. to disable middleware you can changed the `enable` field to `false` of comment the middleware block
  middlewares:
    # Request body limit (ticket P1-03). Uploads get their own larger limit in P1-12.
    limit_payload:
      enable: true
      body_limit: 1mb
    timeout_request:
      enable: true
      timeout: 15000
    compression:
      enable: true
    # Headers for an API: nothing may be framed, sniffed or loaded as a page.
    secure_headers:
      enable: true
      preset: owasp
      overrides:
        "Content-Security-Policy": "default-src 'none'; frame-ancestors 'none'; base-uri 'none'"
        "Cache-Control": "no-store"
        "Referrer-Policy": "no-referrer"
    # Only our own frontend may call the API from a browser.
    cors:
      enable: true
      allow_origins:
        - <%= get_env(name="FRONTEND_URL", default="http://localhost:5173") %>
      allow_headers: ["authorization", "content-type", "x-requested-with"]
      allow_methods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
      allow_credentials: true
      max_age: 3600

# Worker Configuration
workers:
  # specifies the worker mode. Options:
  #   - BackgroundQueue - Workers operate asynchronously in the background, processing queued.
  #   - ForegroundBlocking - Workers operate in the foreground and block until tasks are completed.
  #   - BackgroundAsync - Workers operate asynchronously in the background, processing tasks with async capabilities.
  mode: ForegroundBlocking

  
# Queue Configuration
queue:
  kind: Postgres
  
  # Postgres connection URI
  uri: <%= get_env(name="TEST_QUEUE_URL", default="postgres://app_queue:queue_dev_pw@localhost:5433/brightcone_test") %>
  # Dangerously flush all data in the queue table on startup. dangerous operation, make sure that you using this flag only on dev environments or test mode
  dangerously_flush: false
  

# Mailer Configuration.
mailer:
  stub: true
  # SMTP mailer configuration.
  smtp:
    # Enable/Disable smtp mailer.
    enable: true
    # SMTP server host. e.x localhost, smtp.gmail.com
    host: <%= get_env(name="MAILER_HOST", default="localhost") %>
    # SMTP server port
    port: 1025
    # Use secure connection (SSL/TLS).
    secure: false
    # auth:
    #   user:
    #   password:

# Initializers Configuration
# initializers:
#  oauth2:
#    authorization_code: # Authorization code grant type
#      - client_identifier: google # Identifier for the OAuth2 provider. Replace 'google' with your provider's name if different, must be unique within the oauth2 config.
#        ... other fields

# Test database is isolated from development and reset by SchemaSyncInitializer.
database:
  uri: <%= get_env(name="TEST_DATABASE_URL", default="postgres://app_runtime:runtime_dev_pw@localhost:5433/brightcone_test") %>
  enable_logging: false
  connect_timeout: 500
  idle_timeout: 500
  min_connections: 1
  max_connections: 1
  auto_migrate: false
  dangerously_truncate: false
  dangerously_recreate: false

# Authentication Configuration
auth:
  # JWT authentication
  jwt:
    # Secret key for token generation and verification
    secret: r5laVVzdxdDoiB5pEoQp
    # Token expiration time in seconds
    expiration: 900 # 15 minutes. The refresh cookie keeps people signed in.

# Our own settings (src/settings.rs). Defaults are the safe values.
settings:
  cookie_secure: true
  refresh_ttl_days: 14
  session_ttl_hours: 12
  lockout_threshold: 5
  auth_rate_limit_per_minute: 1000
  trust_proxy: false
  reset_token_minutes: 30
  frontend_url: <%= get_env(name="FRONTEND_URL", default="http://localhost:5173") %>
