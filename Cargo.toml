[workspace]

[package]
name = "brightcone-hr-backend"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "brightcone_hr_backend-cli"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace.dependencies]
loco-rs = { version = "1.2", default-features = false, features = ["auth", "cache_inmem", "cli", "worker", "with-db"] }

[dependencies]
loco-rs = { workspace = true }
sea-orm-migration = { version = "2.0", features = ["runtime-tokio-rustls", "sqlx-postgres"] }
sea-orm = { version = "2.0", features = ["runtime-tokio-rustls", "sqlx-postgres", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
tokio = { version = "1.45", default-features = false, features = [
  "rt-multi-thread",
] }
async-trait = { version = "0.1" }
dotenvy = "0.15"
axum = { version = "0.8" }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
regex = { version = "1.11" }
chrono = { version = "0.4" }
validator = { version = "0.20" }
uuid = { version = "1.6", features = ["v4"] }
# ts-rs derives the TypeScript bindings for the `dtos` (the typed JSON API
# contract). Present for every db app; the SPA frontend consumes the exports,
# and a headless app can still emit them for external consumers.
ts-rs = { version = "12", features = ["chrono-impl", "serde-compat"] }
include_dir = { version = "0.7" }
utoipa = { version = "5", features = ["chrono", "uuid"] }
sha2 = "0.10"
ring = "0.17.14"
governor = "0.10"
tower-http = { version = "0.7", features = [
    "cors",
    "compression-gzip",
    "compression-br",
    "limit",
    "timeout",
] }
[[bin]]
name = "brightcone_hr_backend-cli"
path = "src/bin/main.rs"
required-features = []

[dev-dependencies]
loco-rs = { workspace = true, features = ["testing"] }
serial_test = { version = "3.1.1" }
axum-test = "17"
rstest = { version = "0.25" }
insta = { version = "1.34", features = ["redactions", "yaml", "filters"] }
